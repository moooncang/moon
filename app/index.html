<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#16141B">
<title>MOON</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;700&display=swap">
<style>
/* ============ MOON · 밤의 앱 ============
   크랙과 같은 어두운 앱 구조, 모서리는 직각. 강조색은 달빛 금색 하나. */
:root{color-scheme:dark;
  --bg:#16141B;--surface:#1F1D25;--surface2:#29262F;--surface3:#35313B;--ink:#F6F1E7;--muted:#A9A296;--dim:#8F887D;--line:rgba(255,236,205,.09);--line2:rgba(255,236,205,.055);--hi:inset 0 1px 0 rgba(255,236,205,.06);--gold:linear-gradient(135deg,#FFE28E 0%,#F6C24D 48%,#E3A232 100%);--warm:#F6C24D;
  --brass:#F3C457;--brass-soft:#3A2F1A;--on-brass:#2B1C04;--moon:#F4CE6A;
  --seal:#F0675C;--seal-soft:#2C1614;--ok:#72CB9D;--ok-soft:#132519;--idle:#8D8D95;--idle-soft:#1D1D22;
  --f-display:'Noto Serif KR','Nanum Myeongjo',serif;
  --f-latin:'Cormorant Garamond','Noto Serif KR',serif;
  --f-body:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --ease:cubic-bezier(.2,.7,.2,1);--ease-out:cubic-bezier(.16,1,.3,1);
  --shadow-pop:0 18px 48px -12px rgba(0,0,0,.6),0 2px 6px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-tap-highlight-color:transparent;word-break:keep-all;overflow-wrap:anywhere;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit;border-radius:0}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
::selection{background:var(--brass);color:var(--on-brass)}
html{caret-color:var(--brass);scrollbar-color:var(--surface3) transparent;-webkit-text-size-adjust:100%}
::placeholder{color:var(--dim);opacity:1}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--surface3);border:3px solid var(--bg)}::-webkit-scrollbar-thumb:hover{background:var(--dim)}
h1,h2,h3,h4{text-wrap:balance}p,.ptext,.lede{text-wrap:pretty}
.code,time,.cnt,.stars{font-variant-numeric:tabular-nums}
.app{max-width:600px;margin:0 auto;padding-inline:20px;padding-block:0 150px}
@media (max-width:420px){.app{padding-inline:16px}}

/* ---------- 머리 ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:4px;height:56px;margin:0 -20px 12px;padding:0 12px}
@media (max-width:420px){.top{margin-inline:-16px}}
.top h1{font-size:18px;font-weight:700;margin:0 0 0 2px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top.root{height:68px;padding:0 12px 0 20px}
.top.root h1{font-size:27px;margin:0}
.top h1.wm{font-family:var(--f-latin);font-weight:500;letter-spacing:.34em;font-size:28px}
.top .logo{height:30px;width:auto;display:block}
.bigtabs{flex:1;min-width:0;display:flex;align-items:baseline;gap:16px}
.bigtabs button{border:0;background:none;padding:0;font-size:27px;font-weight:700;color:var(--dim);transition:color .15s}
.bigtabs button[aria-pressed="true"]{color:var(--ink)}
.hicons{display:flex;align-items:center;gap:2px}
.ib{border:0;background:none;width:42px;height:42px;display:grid;place-items:center;flex:none;color:var(--ink)}
.ib svg{width:24px;height:24px;stroke-width:1.6}
.top .act{border:0;background:var(--surface2);padding:7px 13px;font-size:13px;font-weight:500;flex:none}

/* ---------- 하단 탭 · FAB ---------- */
#bnav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(11,11,13,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.bnav-in{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
#bnav button{border:0;background:none;padding:10px 0 9px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;color:var(--dim);font-weight:500}
#bnav button svg,#bnav button img{width:25px;height:25px;stroke-width:1.6;object-fit:contain}
#bnav button[aria-current="page"]{color:var(--ink);font-weight:700}
#bnav button[aria-current="page"] svg{stroke-width:2.1}
#fab{position:fixed;z-index:31;right:max(20px,calc(50% - 280px));bottom:calc(80px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border:0;background:var(--brass);color:var(--on-brass);display:grid;place-items:center;box-shadow:0 8px 24px rgba(0,0,0,.5);transition:transform .15s var(--ease)}
#fab svg{width:26px;height:26px;stroke-width:2}
#fab:active{transform:scale(.94)}

/* ---------- 공통 ---------- */
h2.sec{font-size:17px;font-weight:700;margin:32px 0 12px;display:flex;align-items:baseline;gap:8px}
h2.sec .n{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-weight:400}
.lab{font-size:12.5px;color:var(--muted);font-weight:500}
.muted{color:var(--muted)}
.small{font-size:13px}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.code{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.note{font-size:12.5px;color:var(--muted);margin:8px 0 0}
.chev{color:var(--dim);font-size:22px;line-height:1;font-weight:300}
.card{display:block;width:100%;text-align:left;background:var(--surface);border:0;padding:16px 18px;color:inherit;text-decoration:none}
button.card:active{background:var(--surface2)}
.run{position:relative;padding-left:22px}
.run::before{content:"";position:absolute;left:0;top:0;bottom:0;width:1px;background:var(--wc,var(--brass))}
.run-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.run-title{font-size:18px;font-weight:700;margin:6px 0 2px}
.run-meta{font-size:13.5px;color:var(--muted)}
.run-foot{margin-top:12px;padding-top:10px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.pill,.st{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:2px 7px;white-space:nowrap;background:var(--surface2)}
.pill::before{content:"";width:5px;height:5px;background:currentColor}
.st-진행중,.st-공개중{color:var(--ok)}
.st-완료{color:var(--brass)}
.st-중단{color:var(--idle)}
.st-제작중{color:var(--seal)}
.chip{display:inline-flex;align-items:center;gap:6px;border:0;background:var(--surface2);padding:6px 12px;font-size:13px;color:var(--ink)}
.chip.on{background:var(--ink);color:var(--bg);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.btn{border:0;background:var(--surface2);padding:12px 16px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;color:var(--ink);transition:background .15s}
.btn:active{background:var(--surface3)}
.btn.pri{background:var(--ink);color:var(--bg)}
.btn.wide{width:100%}
.btn.danger{color:var(--seal);background:var(--seal-soft)}
.btn.armed{background:var(--seal);color:#fff}
.btn[disabled],.btn.off{opacity:.35;pointer-events:none}
.btn.sm{padding:6px 12px;font-size:12.5px}
.seg{display:flex;background:var(--surface);overflow-x:auto;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;padding:8px 10px;font-size:13px;color:var(--muted);white-space:nowrap;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--surface3);color:var(--ink);font-weight:700}
.seg .code{color:inherit;opacity:.6}
.banner{background:var(--brass-soft);box-shadow:inset 0 0 0 1px rgba(246,194,77,.22);padding:11px 14px;font-size:13px;display:flex;gap:12px;align-items:center;margin-bottom:16px}
.banner b{color:var(--brass)}
.empty{position:relative;background:var(--surface);padding:44px 20px 36px;text-align:center;color:var(--muted);font-size:13.5px;line-height:1.65;text-wrap:balance}
.empty::before{content:"";display:block;width:26px;height:26px;margin:0 auto 14px;border-radius:50%;box-shadow:inset -7px 3px 0 0 var(--moon);opacity:.55;transform:rotate(-20deg)}

/* ---------- 필터 알약(직각) ---------- */
.pills{display:flex;gap:8px;overflow-x:auto;margin:0 -20px 18px;padding:0 20px;scrollbar-width:none}
@media (max-width:420px){.pills{margin-inline:-16px;padding-inline:16px}}
.pills::-webkit-scrollbar{display:none}
.pills button{flex:none;border:1px solid var(--surface3);background:none;padding:8px 16px;font-size:14px;font-weight:600;color:var(--muted);white-space:nowrap}
.pills button[aria-pressed="true"]{background:var(--brass);border-color:var(--brass);color:var(--on-brass)}
.pills.sub{margin-top:-8px}
.pills.sub button{padding:5px 12px;font-size:12.5px;font-weight:500;border-color:var(--line)}
.pills.sub button[aria-pressed="true"]{background:var(--surface3);border-color:var(--surface3);color:var(--ink)}

/* ---------- 홈 ---------- */
.moonbar{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);padding:2px 0 18px}
.moonbar svg{width:30px;height:30px;flex:none}
.moonbar b{color:var(--moon);font-weight:600}
.hsec{margin-bottom:34px}
.hh{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.hh h2{font-size:20px;font-weight:700;margin:0}
.hh .more{border:0;background:none;padding:4px 0 4px 12px}
.rail{display:grid;grid-auto-flow:column;grid-auto-columns:40%;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -20px;padding:0 20px;scrollbar-width:none}
@media (max-width:420px){.rail{margin-inline:-16px;padding-inline:16px;grid-auto-columns:42%}}
.rail::-webkit-scrollbar{display:none}
.pcv{scroll-snap-align:start;border:0;background:none;padding:0;text-align:left;display:flex;flex-direction:column;gap:3px;color:var(--ink);min-width:0}
.pcv b{font-size:15.5px;font-weight:700;line-height:1.35;margin-top:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pcv small{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cv{position:relative;display:block;aspect-ratio:3/4;overflow:hidden;background:var(--surface2);max-width:100%}
.cv img{width:100%;height:100%;object-fit:cover;display:block}
.cvph{position:absolute;inset:0;background:linear-gradient(160deg,var(--wc) 0%,color-mix(in srgb,var(--wc) 35%,#000) 55%,#121016 100%);display:flex;align-items:flex-end;padding:12px}
.cvph::before{content:"";position:absolute;right:-18%;top:8%;width:62%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 35%,rgba(255,255,255,.28),rgba(255,255,255,0) 62%);}
.cvph i{position:relative;font-style:normal;font-family:var(--f-display);font-weight:700;font-size:19px;line-height:1.25;color:#fff;text-shadow:0 1px 12px rgba(0,0,0,.5);word-break:keep-all}
.cvb{position:absolute;left:0;top:0;font-style:normal;background:rgba(0,0,0,.72);color:#fff;font-size:11px;font-weight:700;padding:4px 8px;letter-spacing:.04em}
.cv-new{display:grid;place-items:center;align-content:center;gap:10px;background:linear-gradient(180deg,var(--surface) 0%,color-mix(in srgb,var(--surface) 60%,var(--bg)) 100%);box-shadow:inset 0 0 0 1px var(--line);color:var(--muted);transition:box-shadow .2s,color .2s}
.cv-new svg{width:22px;height:22px;padding:11px;box-sizing:content-box;color:var(--warm);box-shadow:inset 0 0 0 1px rgba(246,194,77,.35);stroke-width:1.6}
.pcv:hover .cv-new,.wopt:hover .cv-new{box-shadow:inset 0 0 0 1px rgba(246,194,77,.4);color:var(--ink)}
.cv-new i{font-style:normal;font-size:13px}
.quotes{grid-auto-columns:74%}
.qcard{scroll-snap-align:start;border:0;background:var(--surface);padding:18px 18px 14px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;gap:14px;min-height:150px;color:var(--ink);border-top:2px solid var(--moon)}
.qcard .q{font-family:var(--f-display);font-size:15.5px;line-height:1.7;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.qcard .q::before{content:"“";color:var(--moon);margin-right:2px}
.qcard small{font-size:12px;color:var(--muted)}

/* ---------- 목록 (채팅 목록형) ---------- */
.flat{display:flex;flex-direction:column}
.glab{display:flex;align-items:center;justify-content:space-between;font-size:14px;color:var(--muted);font-weight:500;margin:22px 0 6px}
.glab:first-child{margin-top:4px}
.lk{border:0;background:none;color:var(--muted);font-size:13px;padding:4px 0}
.crow2{display:grid;grid-template-columns:62px minmax(0,1fr);gap:14px;align-items:center;width:100%;border:0;background:none;padding:12px 0;text-align:left;color:inherit}
.crow2:active{background:var(--surface)}
.th{width:62px;height:62px;overflow:hidden;background:var(--wc,var(--surface2));display:grid;place-items:center;flex:none;position:relative}
.th img{width:100%;height:100%;object-fit:cover}
.th b{font-family:var(--f-display);font-size:18px;color:#fff;font-weight:700;position:relative}
.th:not(.th-moon):not(.th-no)::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(0,0,0,.35))}
.th:has(img)::after{display:none}
.th-moon{background:var(--surface)}
.th-moon svg{width:40px;height:40px}
.th-no{background:var(--surface);font-family:var(--f-latin);font-size:26px;color:var(--muted)}
.cb{min-width:0;display:flex;flex-direction:column;gap:3px}
.ct{display:flex;align-items:baseline;gap:10px}
.ct b{flex:1;min-width:0;font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ct time{font-size:12.5px;color:var(--dim);flex:none;font-variant-numeric:tabular-nums}
.cp{font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cm{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden}
.badge{display:inline-flex;align-items:center;gap:4px;background:var(--surface2);color:var(--muted);padding:2px 7px;font-size:11.5px;font-weight:600}
.badge svg{width:13px;height:13px}
.stars{color:var(--moon);font-size:11.5px;letter-spacing:1px;white-space:nowrap}
.stars .muted{color:var(--surface3)}
.tag{font-size:12px;color:var(--brass)}

/* ---------- MY ---------- */
.mycard{display:flex;align-items:center;gap:16px;width:100%;border:0;background:var(--surface);padding:20px;text-align:left;color:var(--ink);margin-bottom:10px}
.mycard .av{width:64px;height:64px;background:var(--surface2);display:grid;place-items:center;flex:none}
.mycard .av svg{width:48px;height:48px}
.mycard b{display:block;font-size:19px;font-weight:700}
.mycard small{display:block;font-size:13.5px;color:var(--muted);margin-top:3px}
.mycard.sub{padding:16px 20px}
.mycard.sub small{margin:0 0 2px}
.mycard .big{font-family:var(--f-latin);font-size:34px;font-weight:500;line-height:1}
.mycard .big span{font-size:18px;color:var(--muted)}
.mrow{display:flex;align-items:center;gap:16px;width:100%;border:0;background:none;padding:15px 0;text-align:left;color:var(--ink);font-size:16px;font-weight:500}
.mrow svg{width:24px;height:24px;color:var(--ink);stroke-width:1.5;flex:none}
.mrow .code{margin-right:4px}
.mrow:active{background:var(--surface)}

/* ---------- 입력 ---------- */
.filters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:12px 0 14px}
.filters select,.filters input{padding:8px 9px;font-size:13px}
.filters .full{grid-column:1/-1}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fgrid .full{grid-column:1/-1}
.fld{display:flex;flex-direction:column;gap:6px}
.fld label,.fld .lab2{font-size:12.5px;color:var(--muted);font-weight:500}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=date],input[type=search],select,textarea{width:100%;background:var(--surface);border:1px solid var(--line);padding:11px 12px;font-size:15px;min-width:0;transition:border-color .15s;-webkit-appearance:none;appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 15px) 55%,calc(100% - 10px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--brass)}
textarea{min-height:88px;resize:vertical;line-height:1.6}
input[type=checkbox]{-webkit-appearance:none;appearance:none;width:18px;height:18px;border:1px solid var(--muted);background:transparent;display:inline-grid;place-items:center;margin:0;flex:none;cursor:pointer}
input[type=checkbox]:checked{background:var(--brass);border-color:var(--brass)}
input[type=checkbox]:checked::after{content:"";width:8px;height:4px;border-left:2px solid var(--on-brass);border-bottom:2px solid var(--on-brass);transform:rotate(-45deg) translate(1px,-1px)}
input[type=range]{-webkit-appearance:none;appearance:none;height:18px;background:transparent;width:100%}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:var(--surface3)}
input[type=range]::-moz-range-track{height:2px;background:var(--surface3)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:18px;background:var(--brass);border:0;margin-top:-8px}
input[type=range]::-moz-range-thumb{width:12px;height:18px;background:var(--brass);border:0;border-radius:0}
.aff{display:grid;grid-template-columns:78px 1fr 34px;gap:12px;align-items:center;font-size:14px}
.aff b{font-family:var(--f-mono);font-weight:500;text-align:right;font-variant-numeric:tabular-nums;font-size:13px;color:var(--brass)}
.check{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:14.5px;cursor:pointer}
.check:last-child{border-bottom:0}
.imgpick{display:flex;gap:10px;align-items:center}
.imgpick .prev{width:64px;height:64px;background:var(--surface2);overflow:hidden;flex:none;display:grid;place-items:center;color:var(--muted);font-size:11px}
.imgpick .prev img{width:100%;height:100%;object-fit:cover}
.sw{position:relative;width:46px;height:26px;flex:none}
.sw input{opacity:0;width:100%;height:100%;margin:0;position:absolute;inset:0;cursor:pointer;z-index:1}
.sw i{position:absolute;inset:0;background:var(--surface3);transition:.2s var(--ease)}
.sw i::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;background:var(--muted);transition:.2s var(--ease)}
.sw input:checked + i{background:var(--brass)}
.sw input:checked + i::after{left:23px;background:var(--on-brass)}
.inline-sw{display:flex;align-items:center;justify-content:space-between;gap:12px}

/* ---------- 프로필 ---------- */
.pgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.pcard{padding:0;overflow:hidden;background:none}
.pcard .ph{aspect-ratio:3/4;background:var(--surface2);display:grid;place-items:center;font-family:var(--f-display);font-size:44px;color:var(--muted);max-width:100%}
.pcard .ph img{width:100%;height:100%;object-fit:cover}
.pcard .pb{padding:10px 0 4px}
.pcard .pn{font-weight:700;font-size:16px}
.pcard .ps{font-size:12.5px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.phead{display:flex;gap:18px;align-items:flex-end;padding-bottom:6px}
.phead .ph{width:112px;flex:none;aspect-ratio:3/4;overflow:hidden;background:var(--surface2);display:grid;place-items:center;font-family:var(--f-display);font-size:40px;color:var(--muted)}
.phead .ph img{width:100%;height:100%;object-fit:cover}
.phead .pn{font-size:26px;font-weight:700;line-height:1.25;margin:4px 0}
.copybox{background:var(--surface);box-shadow:inset 1px 0 0 var(--brass),var(--hi);padding:14px 16px;white-space:pre-wrap;font-size:14px;max-height:240px;overflow:auto;line-height:1.7}
dl.kvline{display:grid;grid-template-columns:84px minmax(0,1fr);gap:10px 14px;font-size:14px;margin:0}
dl.kvline dt{font-size:12.5px;color:var(--muted);padding-top:1px}
dl.kvline dd{margin:0;white-space:pre-wrap}

/* ---------- 세션 · 일지 ---------- */
.rhead{position:relative;padding:18px 18px 18px 22px;background:var(--surface)}
.rhead::before{content:"";position:absolute;left:0;top:0;bottom:0;width:1px;background:var(--wc)}
.rhead h2{font-size:23px;font-weight:700;margin:6px 0 12px;line-height:1.3}
.rhead select{width:auto;padding:5px 28px 5px 9px;font-size:12.5px}
.stabs{position:sticky;top:calc(env(safe-area-inset-top,0px) + 56px);z-index:15;background:var(--bg);display:flex;gap:0;overflow-x:auto;margin:10px -20px 18px;padding:0 12px;scrollbar-width:none;border-bottom:1px solid var(--line)}
@media (max-width:420px){.stabs{margin-inline:-16px}}
.stabs::-webkit-scrollbar{display:none}
.stabs button{flex:none;border:0;background:none;padding:13px 10px 11px;font-size:15px;font-weight:600;color:var(--dim);border-bottom:2px solid transparent;margin-bottom:-1px}
.stabs button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.stabs .c{font-family:var(--f-mono);font-size:11px;margin-left:4px;color:var(--muted);font-weight:400}
.kgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:var(--surface);padding:12px 14px}
.stat b{display:block;font-family:var(--f-latin);font-size:34px;font-weight:500;line-height:1;font-variant-numeric:lining-nums}
.stat span{font-size:11.5px;color:var(--muted)}
.relcard{display:grid;gap:12px}
.relcard .nm{font-size:16px;font-weight:700;border:0;background:none;padding:0;text-align:left;color:var(--ink)}
.relcard select{width:auto;padding:6px 28px 6px 9px;font-size:12.5px}
.relcard input[type=text]{font-size:13.5px;border-width:0 0 1px;background:transparent;padding:6px 0}
.delta{font-family:var(--f-mono);font-size:10.5px;padding:0 5px;margin-left:2px;font-weight:600}
.delta.up{color:var(--ok);background:var(--ok-soft)}
.delta.dn{color:var(--seal);background:var(--seal-soft)}
.scene{margin:10px 0;border-left:1px solid color-mix(in srgb,var(--moon) 70%,transparent);padding:4px 0 4px 16px;font-family:var(--f-display);font-size:15.5px;line-height:1.75;white-space:pre-wrap}
.scene .who{display:block;font-family:var(--f-body);font-size:12px;font-weight:600;color:var(--moon);margin-bottom:3px}
.next{background:var(--brass-soft);padding:13px 16px;white-space:pre-wrap}
.next::before{content:"→ ";color:var(--brass);font-weight:700}
ul.evl{margin:0;padding:0;list-style:none;counter-reset:ev}
ul.evl li{counter-increment:ev;padding:8px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:30px 1fr}
ul.evl li::before{content:counter(ev,decimal-leading-zero);font-family:var(--f-mono);font-size:11.5px;color:var(--muted);padding-top:2px}
.thread{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.thread:last-child{border-bottom:0}
.thread span{flex:1;min-width:0}
.thread.done span{text-decoration:line-through;color:var(--muted)}
.xbtn{border:0;background:none;color:var(--muted);padding:4px;display:grid;place-items:center}
.addrow{display:flex;gap:6px;margin-top:10px}
.addrow input{flex:1}
details.fs{background:var(--surface);padding:0 16px}
details.fs summary{padding:14px 0;font-weight:600;font-size:14.5px;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:8px}
details.fs summary::-webkit-details-marker{display:none}
details.fs summary small{font-weight:400;color:var(--muted);margin-right:auto;margin-left:8px;font-size:12px}
details.fs summary::after{content:"+";color:var(--muted)}
details.fs[open] summary{border-bottom:1px solid var(--line);margin-bottom:14px}
details.fs[open] summary::after{content:"−"}
details.fs > .stack{padding-bottom:16px}
details.fs input[type=text],details.fs input[type=number],details.fs input[type=date],details.fs select,details.fs textarea{background:var(--bg)}
.crow{display:grid;grid-template-columns:minmax(0,1fr) 92px;gap:8px;align-items:center}
.crow input{padding:7px 8px;font-size:13.5px}
.scene-row{display:grid;grid-template-columns:92px minmax(0,1fr) 28px;gap:6px;align-items:start}
.scene-row input{padding:9px 8px;font-size:13.5px}
.scene-row textarea{min-height:64px;font-size:14px}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ses-meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 14px;color:var(--muted);margin-top:4px;padding-top:12px;border-top:1px solid var(--line)}
.ses-meta span{font-size:11.5px}
.ses-meta b{display:block;color:var(--ink);font-weight:500;font-size:14px}
.blk{margin-top:26px}
.blk > .lab{display:block;margin-bottom:8px}

/* ---------- 도감 ---------- */
.bar{height:3px;background:var(--surface3)}
.bar i{display:block;height:100%;background:var(--brass)}
.prog{display:grid;grid-template-columns:48px 1fr 52px;gap:12px;align-items:center;font-size:12.5px}
.prog b{font-family:var(--f-mono);font-weight:400;text-align:right;font-variant-numeric:tabular-nums;font-size:11.5px}
.cgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ctile{background:var(--surface);border:0;padding:16px 8px;text-align:center;min-height:108px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--ink)}
.ctile .cn{font-weight:700;font-size:15px}
.ctile .cs{font-size:11px;color:var(--muted);line-height:1.4}
.ctile.lock{background:repeating-linear-gradient(135deg,var(--surface) 0 7px,var(--bg) 7px 8px);color:var(--muted)}
.ctile.lock .cn{letter-spacing:.3em;color:var(--muted)}
.wdot{width:8px;height:8px;display:inline-block;background:var(--wc);flex:none}
.work-hero{padding:22px 20px;background:var(--surface);border-top:3px solid var(--wc,var(--brass))}
.work-hero h2{font-size:25px;font-weight:700;margin:8px 0}
.stamps{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.stamp{padding:16px;background:var(--surface);display:flex;gap:14px;align-items:center}
.stamp .seal{width:46px;height:46px;border:1px dashed var(--surface3);display:grid;place-items:center;flex:none;font-family:var(--f-display);font-size:12px;color:var(--dim);text-align:center;line-height:1.1;font-weight:700}
.stamp.got .seal{border:2px solid var(--seal);color:var(--seal);transform:rotate(-4deg);outline:1px solid var(--seal);outline-offset:2px}
.stamp h4{margin:0;font-size:13.5px;font-weight:600}
.stamp p{margin:2px 0 0;font-size:11.5px;color:var(--muted)}
.menu{background:var(--surface)}
.menu button,.menu a{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;padding:15px 16px;text-align:left;border-bottom:1px solid var(--line);text-decoration:none;color:inherit;font-size:15px}
.menu > :last-child{border-bottom:0}
.menu .mi{flex:1}
.menu .mi small{display:block;color:var(--muted);font-size:12.5px}
.snip{display:flex;gap:12px;align-items:flex-start}
.snip .t{flex:1;min-width:0;cursor:pointer}
.snip .t b{font-size:14.5px;font-weight:600}
.snip .t div{font-size:13px;color:var(--muted);white-space:pre-wrap;margin-top:4px}
.track{display:flex;align-items:center;gap:14px}
.track .pb{width:44px;height:44px;border:0;background:var(--brass);color:var(--on-brass);display:grid;place-items:center;flex:none}
.track .pb.off{background:var(--surface2);color:var(--dim)}
.notice{border-left:1px solid var(--brass);padding:4px 0 4px 14px}
.notice .d{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}

/* ---------- 서랍 · 시트 · 알림 ---------- */
.dveil{position:fixed;inset:0;z-index:55;background:rgba(0,0,0,.6);animation:fade .2s}
.drawer{position:absolute;right:0;top:0;bottom:0;width:min(84%,320px);background:var(--bg);border-left:1px solid var(--line);overflow:auto;padding:calc(20px + env(safe-area-inset-top,0px)) 0 calc(24px + env(safe-area-inset-bottom,0px));animation:slide .26s var(--ease)}
@keyframes slide{from{transform:translateX(30px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}}
.dbrand{display:flex;align-items:center;gap:14px;padding:6px 22px 20px;border-bottom:1px solid var(--line);margin-bottom:6px}
.dbrand svg{width:42px;height:42px;flex:none}
.dbrand b{font-family:var(--f-latin);font-size:25px;letter-spacing:.36em;font-weight:500;display:block;line-height:1.1}
.dbrand small{font-size:12px;color:var(--muted)}
.dgroup{font-size:12px;color:var(--dim);padding:18px 22px 6px;font-weight:500}
.ditem{display:flex;align-items:center;gap:14px;width:100%;border:0;background:none;padding:11px 22px;font-size:15px;text-align:left;color:var(--ink);position:relative}
.ditem svg{width:20px;height:20px;color:var(--muted);flex:none;stroke-width:1.5}
.ditem[aria-current="page"]{font-weight:700;background:var(--surface)}
.ditem[aria-current="page"]::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;background:var(--brass)}
.ditem .cnt{margin-left:auto;font-family:var(--f-mono);font-size:11.5px;color:var(--muted);font-weight:400}
.veil{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet{background:var(--bg);width:100%;max-width:600px;max-height:90%;overflow:auto;border-top:1px solid var(--surface3);padding:14px 20px calc(24px + env(safe-area-inset-bottom,0px));animation:up .26s var(--ease)}
.sheet .grab{width:36px;height:3px;background:var(--surface3);margin:0 auto 16px}
.sheet h3{font-size:20px;font-weight:700;letter-spacing:-.03em;margin:0 0 20px}
.sheet{box-shadow:inset 0 1px 0 rgba(246,194,77,.18),0 -24px 60px rgba(0,0,0,.45)}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.sheet,.drawer{animation-timing-function:var(--ease-out);animation-duration:.38s}
@media (prefers-reduced-motion:reduce){.sheet,.drawer,.dveil,.veil{animation:none}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--surface3);color:var(--ink);padding:12px 18px;font-size:13.5px;font-weight:500;max-width:calc(100% - 32px);box-shadow:inset 0 1px 0 rgba(246,194,77,.3),var(--shadow-pop);animation:tin .34s var(--ease-out)}
@keyframes tin{from{opacity:0;transform:translate(-50%,10px);filter:blur(3px)}}
@media (prefers-reduced-motion:reduce){.toast{animation:none}}
.mini{position:fixed;left:0;right:0;z-index:29;bottom:calc(66px + env(safe-area-inset-bottom,0px))}
.mini-in{max-width:600px;margin:0 auto;padding-inline:16px}
.mini-bar{display:flex;align-items:center;gap:10px;background:var(--surface2);color:var(--ink);padding:8px 10px 8px 16px;font-size:13px;box-shadow:inset 0 1px 0 rgba(246,194,77,.35),var(--shadow-pop);margin-right:74px}
.mini-bar span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-bar button{border:0;background:none;color:inherit;padding:4px 6px}


/* ============ 고급화 레이어 ============ */
body{letter-spacing:-.005em}
.top h1,.hh h2,h2.sec,.run-title,.ct b,.pcv b,.mycard b,.rhead h2,.work-hero h2,.post .pt,.bigtabs button{letter-spacing:-.025em}
.top{transition:box-shadow .2s,background .2s}
.top.scrolled{background:rgba(22,20,27,.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 1px 0 var(--line)}
.view.enter{animation:vin .32s var(--ease)}
@keyframes vin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.view.enter{animation:none}}
.card,.empty,.stat,.qcard,.mycard,.cmt,details.fs,.ctile,.stamp,.menu,.rhead,.work-hero{box-shadow:var(--hi)}
button.card,.pcv,.qcard,.wcard,.mycard,.crow2,.addcard,.feat,.ctile{transition:transform .18s var(--ease),background .18s,opacity .18s}
button.card:active,.pcv:active,.qcard:active,.wcard:active,.mycard:active,.addcard:active,.feat:active{transform:scale(.985)}
.hh{align-items:flex-end}
.hh .more{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:4px}
.hh .more .chev{font-size:17px}
.lk{border:0;background:none;color:var(--brass);font-size:13px;padding:2px 0}
#bnav{background:rgba(22,20,27,.9);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
#bnav button{position:relative}
#bnav button[aria-current="page"]::before{content:"";position:absolute;top:-1px;left:50%;width:22px;height:2px;transform:translateX(-50%);background:var(--gold)}
#fab{background:var(--gold);box-shadow:0 10px 30px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.45)}
.pills button[aria-pressed="true"]{background:var(--gold);border-color:transparent}
.cv,.th,.feat,.whero{isolation:isolate}
.cv::after,.th::before{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);pointer-events:none;z-index:2}
.cv img{transition:transform .5s var(--ease)}
.pcv:hover .cv img{transform:scale(1.03)}
.cvph{background:radial-gradient(120% 80% at 80% 10%,color-mix(in srgb,var(--wc) 85%,#fff 8%) 0%,transparent 60%),linear-gradient(170deg,color-mix(in srgb,var(--wc) 70%,#000) 0%,#16141B 92%)}
.cvph::before{background:radial-gradient(circle at 38% 38%,rgba(255,255,255,.35),rgba(255,255,255,.04) 55%,rgba(255,255,255,0) 64%)}
.cvph i{font-size:18px;letter-spacing:-.03em}
.cvb{background:rgba(22,20,27,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font-weight:600;letter-spacing:.02em;font-size:11px;padding:4px 8px;color:var(--warm);box-shadow:inset 0 0 0 1px rgba(246,194,77,.18)}
/* 홈 피처드 */
.feat{position:relative;display:block;width:100%;aspect-ratio:16/11;max-height:300px;border:0;padding:0;margin:0 0 30px;overflow:hidden;background:var(--surface);text-align:left;color:#fff}
.feat > img,.feat > .cvph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 18%}
.feat::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(22,20,27,0) 25%,rgba(22,20,27,.55) 60%,rgba(22,20,27,.95) 100%);z-index:1}
.fo{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:20px;display:flex;flex-direction:column;gap:4px}
.fo b{font-size:26px;font-weight:700;letter-spacing:-.03em;line-height:1.2;text-shadow:0 2px 18px rgba(0,0,0,.45)}
.fo small{font-size:13px;color:rgba(255,255,255,.74);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fo .fnext{margin-top:4px;font-size:13.5px;color:rgba(255,255,255,.9)}
.fo .fnext::before{content:"→ ";color:var(--warm);font-weight:700}

const Store = {
  db: null, key: 'moon-archive',
  async open() { try { this.db = await new Promise((res, rej) => { const r = indexedDB.open(this.key, 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); } catch (e) { this.db = null; } },
  async load() {
    if (this.db) { try { return await new Promise((res, rej) => { const q = this.db.transaction('kv').objectStore('kv').get('state'); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); } catch (e) {} }
    try { const s = localStorage.getItem(this.key); return s ? JSON.parse(s) : null; } catch (e) { return null; }
  },
  async save(v) {
    if (this.db) { try { await new Promise((res, rej) => { const tx = this.db.transaction('kv', 'readwrite'); tx.objectStore('kv').put(v, 'state'); tx.oncomplete = res; tx.onerror = () => rej(tx.error); }); return; } catch (e) {} }
    try { localStorage.setItem(this.key, JSON.stringify(v)); } catch (e) {}
  }
};

          <div class="aff" style="grid-template-columns:1fr 34px"><input type="range" min="0" max="100" step="5" value="${v}" data-bind="aff" data-key="${cid}" aria-label="관계 수치"><b>${v}</b></div>
          <div class="row" style="gap:6px;flex-wrap:nowrap"><input type="text" id="cm-${cid}" style="flex:1" placeholder="이 인물에 대한 메모" value="${esc(r.cmemo[cid] || '')}" data-bind="cmemo" data-key="${cid}">${cpBtn(r.cmemo[cid] ? `${charName(w.id, cid)}: ${r.cmemo[cid]}` : '')}</div>
          <div class="code">일지 ${ss.filter(e => e.chars.includes(cid)).length}회 등장 · 기록된 변화 ${deltas > 0 ? '+' : ''}${deltas}</div></div>`; }).join('') || '<div class="empty">아직 체크한 인물이 없어요.</div>'}
        <button class="btn wide" data-act="pickMet">+ 만난 인물 체크</button></div>`;
    } else if (sec === 'event') {
      body = `${w.events.length ? `<div class="blh"><span class="lab">이벤트</span></div><div class="card" style="padding-block:4px">${w.events.map(e => `<label class="check"><input type="checkbox" data-bind="evt" data-kind="events" data-key="${e.id}" ${r.events.includes(e.id) ? 'checked' : ''}>${esc(e.name)}</label>`).join('')}</div>` : ''}
        ${w.endings.length ? `<div class="blh" style="margin-top:18px"><span class="lab">엔딩</span></div><div class="card" style="padding-block:4px">${w.endings.map(e => `<label class="check"><input type="checkbox" data-bind="evt" data-kind="endings" data-key="${e.id}" ${r.endings.includes(e.id) ? 'checked' : ''}>${esc(e.name)}</label>`).join('')}</div>` : ''}
        <div class="blh" style="margin-top:18px"><span class="lab">내 이벤트 · 목표</span></div>
        <div class="card" style="padding-block:4px">${r.myEvents.map(x => `<div class="thread ${x.done ? 'done' : ''}"><input type="checkbox" data-bind="myEvt" data-key="${x.id}" ${x.done ? 'checked' : ''} aria-label="달성"><span>${esc(x.name)}</span>${cpBtn(x.name)}<button class="xbtn" data-act="delMyEvt" data-id="${x.id}" aria-label="삭제">${ICON.x}</button></div>`).join('') || '<p class="muted small" style="margin:10px 0">직접 정한 목표나 이벤트를 추가해보세요.</p>'}</div>
        <div class="addrow"><input type="text" id="myEvtIn" placeholder="예: 모루 3단계 진화"><button class="btn" data-act="addMyEvt">추가</button></div>`;
    } else if (sec === 'ses') {
      const desc = c.sd !== false; const list = desc ? ss.slice().reverse() : ss;
      body = `<div class="row" style="margin-bottom:6px"><button class="btn sm pri" data-act="newSession" data-id="${r.id}">${ICON.pen} 일지 쓰기</button><span class="grow"></span><button class="btn sm" data-act="sesSort">${desc ? '최신순' : '오래된순'}</button></div>
        ${list.length ? `<div class="flat">${list.map(e => sesRow(e)).join('')}</div>` : '<div class="empty">플레이할 때마다 일지를 하나씩 남겨보세요.</div>'}`;
    } else if (sec === 'scene') {
      const fc = c.fc || '';
      const all = ss.slice().reverse().flatMap(e => e.scenes.map(s => [e, s])).filter(([e, s]) => !fc || s.who === charName(w.id, fc) || e.chars.includes(fc));
      body = `<div class="chips" style="margin-bottom:14px"><button class="chip ${fc ? '' : 'on'}" data-act="sceneChar" data-id="">전체</button>${r.met.map(cid => `<button class="chip ${fc === cid ? 'on' : ''}" data-act="sceneChar" data-id="${cid}">${esc(charName(w.id, cid))}</button>`).join('')}</div>
        <div class="stack">${all.map(([e, s]) => `<div class="scard"><div class="scene">${s.who ? `<span class="who">${esc(s.who)}</span>` : ''}${esc(s.text)}</div><div class="sfoot2"><button class="lk" data-act="openSession" data-id="${e.id}">${md(e.date)} · 일지 #${String(sesNo(e)).padStart(2, '0')} ›</button><span class="iacts"><button class="cp" data-act="scard" data-run="${r.id}" data-who="${esc(s.who)}" data-text="${esc(s.text)}" aria-label="카드로 만들기">${ICON.card}</button>${cpBtn(`${s.who ? s.who + ': ' : ''}${s.text}`)}</span></div></div>`).join('') || '<div class="empty">일지에 명장면을 붙여넣으면 여기 모여요.</div>'}</div>`;
    } else if (EXT_SEC[sec]) {
      body = EXT_SEC[sec](r, c);
    } else if (KINDS[sec]) {
      body = kindSection(r, sec);
    } else if (sec === 'notes') {
      const ns = r.noteIds.map(id => S.notes.find(n => n.id === id)).filter(Boolean);
      body = `${ns.length ? `<div class="stack">${ns.map(n => `<div class="card"><div class="ih"><button class="nm" data-act="openNote" data-id="${n.id}">${esc(n.title || '제목 없음')} ${chev}</button><span class="iacts">${cpBtn(n.body)}</span></div><p class="ptext clamp">${esc(n.body)}</p>${igrid(n.imgs)}<div class="code">${n.body.length}자</div></div>`).join('')}</div>` : '<div class="empty">이 세션에 연결한 유저노트가 없어요.</div>'}
        <div class="row" style="margin-top:12px"><button class="btn grow" data-act="linkNotes">${ICON.link} 노트 연결</button><button class="btn pri grow" data-act="newLinkedNote">${ICON.pen} 새 노트</button></div>`;
    } else {
      body = `<div class="blh"><span class="lab">떡밥 · 복선 추적</span>${openT ? cpBtn(r.threads.filter(t => !t.done).map(t => '- ' + t.text).join('\n')) : ''}</div>
        <div class="card" style="padding-block:4px">${r.threads.map(t => `<div class="thread ${t.done ? 'done' : ''}"><input type="checkbox" data-bind="thread" data-key="${t.id}" ${t.done ? 'checked' : ''} aria-label="해결"><span>${esc(t.text)}</span>${cpBtn(t.text)}<button class="xbtn" data-act="delThread" data-id="${t.id}" aria-label="삭제">${ICON.x}</button></div>`).join('') || '<p class="muted small" style="margin:10px 0">궁금한 점, 풀리지 않은 복선을 적어두세요.</p>'}</div>
        <div class="addrow"><input type="text" id="threadIn" placeholder="예: 지하의 신호음 정체"><button class="btn" data-act="addThread">추가</button></div>
        <div class="blh" style="margin-top:22px"><span class="lab">크랙 대화방 링크</span></div>
        <div class="row" style="flex-wrap:nowrap"><input type="text" id="runLink" style="flex:1" placeholder="https://" value="${esc(r.link)}" data-bind="runLink">${r.link ? `<a class="btn" href="${esc(r.link)}" target="_blank" rel="noopener">열기</a>` : ''}</div>
        <div class="blh" style="margin-top:22px"><span class="lab">자유 메모</span>${cpBtn(r.memo)}</div>
        <textarea id="runMemo" rows="6" data-bind="runMemo" placeholder="규칙, 설정 메모, 기억할 것">${esc(r.memo)}</textarea>
        <div class="blh" style="margin-top:18px"><span class="lab">메모 이미지</span></div>
        ${igrid(r.memoImgs)}<div class="row" style="margin-top:8px"><label class="btn sm" for="memoImg">${ICON.image} 이미지 넣기</label><input type="file" id="memoImg" accept="image/*" multiple hidden data-bind="memoImgs">${r.memoImgs.length ? '<button class="btn sm" data-act="clearMemoImgs" data-arm="1">이미지 모두 빼기</button>' : ''}</div>`;
    }
    return { title: r.title, action: `<button class="act" data-act="editRun" data-id="${r.id}">수정</button>`, html: `
      ${runHero(r)}
      <div class="stabs" role="tablist">${SECS.map(([k, l, n]) => `<button role="tab" data-act="runSec" data-id="${k}" aria-pressed="${sec === k}">${l}${n !== undefined && n !== '' ? `<span class="c">${n}</span>` : ''}</button>`).join('')}</div>
      ${body}` };
  },

  /* ---------- 일지 상세 ---------- */
  session(c) {
    const e = ENT(c.id); if (!e) return { title: '없는 일지', html: '<div class="empty">삭제된 일지예요.</div>' };
    const r = RUN(e.runId), w = W(r.workId), ss = sessionsOf(r.id), i = ss.indexOf(e);
    const blk = (l, h, t) => h ? `<div class="blk"><div class="blh"><span class="lab">${l}</span>${cpBtn(t)}</div>${h}</div>` : '';
    const meta = [['날짜', e.date], ['게임 속 시점', e.when], ['장소', e.place], ['분위기', e.mood]].filter(x => x[1]);
    return { title: `일지 ${String(i + 1).padStart(2, '0')}`, action: `<button class="act" data-act="editSession" data-id="${e.id}">수정</button>`, html: `
      ${runHero(r, true)}
      <div class="dcard"><div class="dch2"><h2>${esc(e.title || '제목 없는 일지')}</h2>${e.rating ? `<span class="stars">${stars(e.rating)}</span>` : ''}</div>
        ${meta.length ? `<div class="ses-meta">${meta.map(([k, v]) => `<span>${k} <b>${esc(v)}</b></span>`).join('')}</div>` : ''}
        <button class="btn wide" style="margin-top:14px" data-act="copy" data-text="${esc(entryText(e))}">${ICON.copy} 일지 전체 복사</button></div>
      ${e.imgs.length ? `<div class="blk">${igrid(e.imgs)}</div>` : ''}
      ${blk('요약', e.summary ? `<p class="ptext">${esc(e.summary)}</p>` : '', e.summary)}
      ${blk('주요 사건', e.events ? `<ul class="evl">${e.events.split('\n').filter(Boolean).map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : '', e.events)}
      ${blk('내 선택', e.choice ? `<div class="card ptext">${esc(e.choice)}</div>` : '', e.choice)}
      ${blk('등장 인물', e.chars.length ? `<div class="chips">${e.chars.map(cid => { const d = +e.delta[cid] || 0; return `<button class="chip" data-act="openChar" data-id="${w.id}:${cid}">${esc(charName(w.id, cid))}${d ? `<span class="delta ${d > 0 ? 'up' : 'dn'}">${d > 0 ? '+' : ''}${d}</span>` : ''}</button>`; }).join('')}</div>` : '')}
      ${blk('명장면', e.scenes.length ? e.scenes.map(s => `<div class="scard"><div class="scene">${s.who ? `<span class="who">${esc(s.who)}</span>` : ''}${esc(s.text)}</div><div class="sfoot2"><span></span><span class="iacts"><button class="cp" data-act="scard" data-run="${r.id}" data-who="${esc(s.who)}" data-text="${esc(s.text)}" aria-label="카드로 만들기">${ICON.card}<span>카드</span></button>${cpBtn(`${s.who ? s.who + ': ' : ''}${s.text}`)}</span></div></div>`).join('') : '', e.scenes.map(s => `${s.who ? s.who + ': ' : ''}${s.text}`).join('\n'))}
      ${blk('변화 · 획득', e.gain ? `<div class="card ptext">${esc(e.gain)}</div>` : '', e.gain)}
      ${blk('다음에 할 것', e.next ? `<div class="next">${esc(e.next)}</div>` : '', e.next)}
      ${e.tags.length ? `<div class="blk row">${e.tags.map(t => `<span class="tag">#${esc(t)}</span>`).join('')}</div>` : ''}
      <div class="pager" style="margin-top:26px"><button class="btn ${i > 0 ? '' : 'off'}" data-act="sesJump" data-id="${i > 0 ? ss[i - 1].id : ''}">‹ 이전 일지</button><button class="btn ${i < ss.length - 1 ? '' : 'off'}" data-act="sesJump" data-id="${i < ss.length - 1 ? ss[i + 1].id : ''}">다음 일지 ›</button></div>` };
  },

  /* ---------- 일지 모아보기 ---------- */
  sessions(c) {
    const fw = c.w || '', fp = c.p || '', q = (c.q || '').trim();
    const list = S.entries.filter(e => { const r = RUN(e.runId); if (!r) return false; if (fw && r.workId !== fw) return false; if (fp && r.profileId !== fp) return false;
      if (q && !(e.title + e.summary + e.place + e.events + e.tags.join(' ') + e.scenes.map(s => s.text).join(' ')).includes(q)) return false; return true; })
      .sort((a, b) => (b.date || '').localeCompare(a.date || '') || b.created - a.created);
    return { title: '일지 모아보기', html: `
      <div class="filters">${sel('sw', 'flt', [['', '모든 작품'], ...AW().map(w => [w.id, w.title])], fw, 'w')}${sel('sp', 'flt', [['', '모든 프로필'], ...S.profiles.map(p => [p.id, p.name])], fp, 'p')}<span class="code" style="align-self:center;text-align:right">${list.length}편</span>
        <input type="search" id="sesQ" class="full" placeholder="제목·장소·사건·대사·태그 검색" value="${esc(q)}" data-bind="sesQ"></div>
      ${list.length ? `<div class="list">${list.map(e => sesRow(e, true)).join('')}</div>` : '<div class="empty">해당하는 일지가 없어요.</div>'}` };
  },

  /* ---------- 프로필 ---------- */
  profiles() {
    return { title: '프로필 도감', action: `<button class="act" data-act="newProfile">+ 새 프로필</button>`, html: `
      ${sampleBanner()}
      <p class="muted small" style="margin:0 0 14px">크랙에서 쓰는 내 캐릭터(유저 프로필)를 모아두는 곳이에요.</p>
      <div class="pgrid">${S.profiles.map(p => `<button class="card pcard" data-act="openProfile" data-id="${p.id}">
        <div class="ph">${p.img ? `<img src="${p.img}" alt="">` : esc((p.name || '?')[0])}</div>
        <div class="pb"><div class="pn">${esc(p.name)}</div><div class="ps">${esc(p.summary)}</div><div class="code" style="margin-top:6px">세션 ${runsOf(p.id).length} · 일지 ${runsOf(p.id).reduce((n, r) => n + sessionsOf(r.id).length, 0)}</div></div></button>`).join('')}
        <button class="card pcard" data-act="newProfile" style="border-style:dashed"><div class="ph" style="font-size:30px">＋</div><div class="pb"><div class="pn">새 프로필</div><div class="ps">페르소나 추가</div></div></button></div>` };
  },
  profile(c) {
    const p = P(c.id); if (!p) return { title: '없는 프로필', html: '<div class="empty">삭제된 프로필이에요.</div>' };
    const rs = runsOf(p.id).sort((a, b) => b.updated - a.updated);
    const text = p.crack || composeCrack(p);
    const kv = [['한 줄 소개', p.summary], ['외형', p.appearance], ['성격', p.personality], ['배경', p.background], ['말투', p.speech], ['메모', p.memo]].filter(x => x[1]);
    return { title: p.name, action: `<button class="act" data-act="editProfile" data-id="${p.id}">수정</button>`, html: `
      <div class="phead"><div class="ph">${p.img ? `<img src="${p.img}" alt="">` : esc((p.name || '?')[0])}</div>
        <div><div class="lab">PERSONA</div><div class="pn">${esc(p.name)}</div><div class="muted small">세션 ${rs.length} · 일지 ${rs.reduce((n, r) => n + sessionsOf(r.id).length, 0)}</div></div></div>
      <h2 class="sec">설정</h2>
      <div class="card"><dl class="kvline">${kv.map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join('') || '<dd class="muted">아직 적은 설정이 없어요.</dd>'}</dl></div>
      <h2 class="sec">크랙 입력용 <span class="n">${text.length}자</span></h2>
      <div class="copybox">${esc(text) || '<span class="muted">설정을 적으면 여기에 입력용 문구가 만들어져요.</span>'}</div>
      <button class="btn pri wide" style="margin-top:8px" data-act="copy" data-text="${esc(text)}">복사하기</button>
      <p class="note">${p.crack ? '직접 적은 입력용 문구예요.' : '위 설정으로 자동으로 만든 문구예요. 수정 화면에서 직접 고칠 수 있어요.'}</p>
      <h2 class="sec">이 프로필의 세션 <span class="n">${rs.length}</span></h2>
      ${rs.length ? `<div class="list">${rs.map(runRow).join('')}</div>` : ''}
      <button class="btn wide" style="margin-top:10px" data-act="newRun" data-profile="${p.id}">+ 이 프로필로 새 세션</button>` };
  },

  /* ---------- 도감 ---------- */
  dex(c) {
    const seg = c.seg || 'collect';
    const segs = [['collect', '수집률'], ['chars', '인물'], ['scenes', '명장면'], ['lore', '세계관']];
    let body = '';
    if (seg === 'collect') {
      body = `<div class="stack">${AW().map(w => {
        const m = metSet(w.id).size, ev = unionOf(w.id, 'events').size, en = unionOf(w.id, 'endings').size, rs = S.runs.filter(r => r.workId === w.id);
        const bar = (a, b) => b ? `<div class="bar"><i style="width:${Math.round(a / b * 100)}%"></i></div>` : '<div class="muted small">—</div>';
        return `<div class="card" style="--wc:${w.color}"><div class="row"><span class="wdot"></span><b class="grow" style="font-family:var(--f-display);font-size:16.5px">${esc(w.title)}</b><span class="code">세션 ${rs.length} · 일지 ${rs.reduce((n, r) => n + sessionsOf(r.id).length, 0)}</span></div>
          <div class="stack" style="margin-top:12px;gap:8px"><div class="prog"><span>인물</span>${bar(m, w.chars.length)}<b>${m}/${w.chars.length}</b></div><div class="prog"><span>이벤트</span>${bar(ev, w.events.length)}<b>${ev}/${w.events.length}</b></div><div class="prog"><span>엔딩</span>${bar(en, w.endings.length)}<b>${en}/${w.endings.length}</b></div></div></div>`;
      }).join('')}</div>`;
    } else if (seg === 'chars') {
      const wid = c.work || AW()[0].id, w = W(wid), ms = metSet(wid);
      body = `<div class="chips" style="margin-bottom:12px">${AW().map(x => `<button class="chip ${x.id === wid ? 'on' : ''}" data-act="dexWork" data-id="${x.id}">${esc(x.title)}</button>`).join('')}</div>
        <div class="cgrid">${w.chars.map(ch => isOpen(wid, ch.id)
          ? `<button class="ctile ${ch.img ? 'hasimg' : ''}" data-act="openChar" data-id="${wid}:${ch.id}">${ch.img ? `<span class="cimg"><img src="${esc(ch.img)}" alt="" loading="lazy"></span>` : ''}<span class="cn">${esc(ch.name)}</span><span class="cs">${esc(ch.sub || '')}</span>${ms.has(ch.id) ? '' : '<span class="code">미확인</span>'}</button>`
          : `<button class="ctile lock" data-act="openChar" data-id="${wid}:${ch.id}">${ICON.lock}<span class="cn">???</span><span class="cs">만나면 열려요</span></button>`).join('')}</div>
        <p class="note">${S.settings.spoiler ? '스포일러 잠금이 켜져 있어요. 세션에서 만난 인물로 체크하면 열립니다.' : '스포일러 잠금이 꺼져 있어요.'}</p>`;
    } else if (seg === 'scenes') {
      const q = (c.q || '').trim();
      const all = S.entries.slice().sort((a, b) => (b.date || '').localeCompare(a.date || '')).flatMap(e => e.scenes.map(s => [e, s]))
        .filter(([e, s]) => !q || (s.text + ' ' + s.who + ' ' + e.tags.join(' ') + ' ' + e.title).includes(q));
      const tags = [...new Set(S.entries.flatMap(e => e.tags))];
      body = `<input type="search" id="sceneQ" placeholder="대사·인물·태그로 찾기" value="${esc(q)}" data-bind="sceneQ">
        <div class="chips" style="margin:10px 0 12px">${tags.map(t => `<button class="chip ${q === t ? 'on' : ''}" data-act="sceneTag" data-id="${esc(t)}">#${esc(t)}</button>`).join('')}</div>
        <div class="stack">${all.map(([e, s]) => sceneCard(e, s)).join('') || '<div class="empty">명장면이 없어요. 일지를 기록할 때 대사를 붙여넣어 보세요.</div>'}</div>`;
    } else {
      body = `<div class="stack">${AW().filter(w => w.lore.length).map(w => `<div class="card" style="--wc:${w.color}"><div class="row"><span class="wdot"></span><b style="font-family:var(--f-display);font-size:16.5px">${esc(w.title)}</b></div>
        ${w.lore.map(l => `<div class="lab" style="margin:14px 0 6px">${esc(l.cat)}</div><div class="chips">${l.items.map(i => `<span class="chip">${esc(i.name)}${i.text ? ` <span class="muted small">${esc(i.text)}</span>` : ''}</span>`).join('')}</div>`).join('')}</div>`).join('') || '<div class="empty">등록된 세계관 정보가 없어요.</div>'}</div>`;
    }
    return { title: '기록 도감', html: `<div class="seg" style="margin-bottom:16px">${segs.map(([k, l]) => `<button data-act="dexSeg" data-id="${k}" aria-pressed="${seg === k}">${l}</button>`).join('')}</div>${body}` };
  },
  char(c) {
    const [wid, cid] = c.id.split(':'); const w = W(wid); const ch = w.chars.find(x => x.id === cid) || { name: cid };

/* ================= BGM ================= */
const audio = new Audio(); audio.loop = true; let playing = null;
function trackHtml(t) {
  const i = BGM.indexOf(t); const on = playing === i && !audio.paused;
  return `<div class="card track"><button class="pb ${t.url ? '' : 'off'}" data-act="play" data-id="${i}" aria-label="${on ? '일시정지' : '재생'}">${on ? ICON.pause : ICON.play}</button><div class="grow"><b>${esc(t.title)}</b><div class="muted small">${esc(W(t.work).title)}${t.url ? '' : ' · 음원 준비 중'}</div></div></div>`;
}
function renderMini() {
  const m = $('#mini'); if (playing == null) { m.hidden = true; return; }
  m.hidden = false;
  m.innerHTML = `<div class="mini-in"><div class="mini-bar"><span>♪ ${esc(BGM[playing].title)}</span><button data-act="play" data-id="${playing}" aria-label="재생/일시정지">${audio.paused ? ICON.play : ICON.pause}</button><button data-act="stop" aria-label="닫기">${ICON.x}</button></div></div>`;
}
audio.addEventListener('play', render); audio.addEventListener('pause', render);

/* ================= 시트(입력 창) ================= */
let formImg = null;
function openSheet(title, inner) {
  closeSheet();
  const v = document.createElement('div'); v.className = 'veil'; v.id = 'veil';
  v.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="grab"></div><h3>${esc(title)}</h3>${inner}</div>`;
  v.addEventListener('click', e => { if (e.target === v) closeSheet(); });
  document.body.appendChild(v); document.body.style.overflow = 'hidden';
}
function closeSheet() { const v = $('#veil'); if (v) v.remove(); if (!$('#dveil')) document.body.style.overflow = ''; }
const fld = (id, label, html, full) => `<div class="fld ${full ? 'full' : ''}"><label for="${id}">${label}</label>${html}</div>`;
const inp = (id, v, ph = '') => `<input type="text" id="${id}" name="${id}" value="${esc(v)}" placeholder="${esc(ph)}">`;
const ta = (id, v, ph = '', rows = 3) => `<textarea id="${id}" name="${id}" rows="${rows}" placeholder="${esc(ph)}">${esc(v)}</textarea>`;
const imgPick = (v, label = '이미지') => `<div class="fld"><span class="lab2">${label}</span><div class="imgpick"><div class="prev" id="imgPrev">${v ? `<img src="${v}" alt="">` : '없음'}</div><label class="btn sm" for="imgFile">사진 고르기</label><input type="file" id="imgFile" accept="image/*" hidden data-bind="img">${v ? '<button type="button" class="btn sm" data-act="imgClear">빼기</button>' : ''}</div></div>`;
const delBtn = (act, id) => `<button type="button" class="btn danger" data-act="${act}" data-id="${id}" data-arm="1">삭제</button>`;

function composeCrack(p) { return [['이름', p.name], ['외형', p.appearance], ['성격', p.personality], ['배경', p.background], ['말투', p.speech]].filter(x => x[1]).map(([k, v]) => `${k}: ${v}`).join('\n'); }
function profileForm(p) {
  formImg = p ? p.img : '';
  openSheet(p ? '프로필 수정' : '새 프로필', `<form data-form="profile" data-id="${p ? p.id : ''}" class="stack">
    ${imgPick(formImg)}${fld('pName', '이름', inp('pName', p?.name, '예: 한서진'))}${fld('pSum', '한 줄 소개', inp('pSum', p?.summary, '어떤 사람인가요?'))}
    ${fld('pApp', '외형', ta('pApp', p?.appearance, '', 2))}${fld('pPer', '성격', ta('pPer', p?.personality, '', 2))}${fld('pBg', '배경', ta('pBg', p?.background, '', 2))}
    ${fld('pSp', '말투', inp('pSp', p?.speech))}${fld('pMemo', '메모', ta('pMemo', p?.memo, '나만 볼 메모', 2))}
    ${fld('pCrack', '크랙 입력용 문구 (비우면 자동 작성)', ta('pCrack', p?.crack, '직접 다듬은 문구가 있다면 붙여넣으세요', 4))}
    <div class="row">${p ? delBtn('delProfile', p.id) : ''}<button class="btn pri grow" type="submit">저장</button></div></form>`);
}
function runForm(r, preset = {}) {
  if (!S.profiles.length) { toast('먼저 프로필을 만들어주세요'); profileForm(); return; }
  const pid = r?.profileId || preset.profile || S.profiles[0].id, wid = r?.workId || preset.work || (FW(cur().w) ? cur().w : AW()[0].id);
  formImg = r ? (r.cover || '') : '';
  openSheet(r ? '세션 수정' : '새 세션', `<form data-form="run" data-id="${r ? r.id : ''}" class="stack">
    <div class="fld"><span class="lab2">어느 작품인가요?</span>${r ? `<div class="wfixed">${thumb(W(r.workId))}<b>${esc(W(r.workId).title)}</b></div>` : `<div class="wpick">${AW().map(w => `<label class="wopt"><input type="radio" name="rWork" value="${w.id}" ${w.id === wid ? 'checked' : ''}>${cover(w, w.custom ? 'MY' : '')}<span>${esc(w.title)}</span></label>`).join('')}<button type="button" class="wopt add" data-act="newWork"><span class="cv cv-new">${ICON.plus}</span><span>작품 추가</span></button></div>`}</div>
    <div class="fld"><span class="lab2">누구로 플레이하나요?</span><div class="ppick">${S.profiles.map(p => `<label class="popt"><input type="radio" name="rProf" value="${p.id}" ${p.id === pid ? 'checked' : ''}><span class="pav">${pav(p)}</span><span>${esc(p.name)}</span></label>`).join('')}<button type="button" class="popt add" data-act="newProfile"><span class="pav">${ICON.plus}</span><span>새 프로필</span></button></div></div>

function parseWork(fd, old) {
  const g = k => (fd.get(k) || '').toString();
  const L = k => g(k).split('\n').map(x => x.trim()).filter(Boolean);
  const keep = (arr, name) => (arr || []).find(x => x.name === name || x.label === name);
  const chars = L('wChars').map(l => { const [name, ...rest] = l.split('/'); const n = name.trim(); return { id: keep(old?.chars, n)?.id || uid(), name: n, sub: rest.join('/').trim() }; });
  const fields = L('wFields').map(l => { let m;
    if ((m = l.match(/^(.+?)\s*=\s*(.+)$/))) { const label = m[1].trim(); return { key: keep(old?.fields, label)?.key || uid(), label, type: 'select', options: m[2].split(',').map(x => x.trim()).filter(Boolean) }; }
    if ((m = l.match(/^(.+?)\s*#$/))) { const label = m[1].trim(); return { key: keep(old?.fields, label)?.key || uid(), label, type: 'number' }; }
    return { key: keep(old?.fields, l)?.key || uid(), label: l, type: 'text' }; });
  const ev = (k, arr) => L(k).map(n => ({ id: keep(arr, n)?.id || uid(), name: n }));
  return { title: g('wTitle').trim(), creator: g('wCreator').trim(), genre: g('wGenre').trim(), desc: g('wDesc').trim(), crack: /^https?:\/\//.test(g('wCrack').trim()) ? g('wCrack').trim() : '',
    color: g('wColor') || SWATCH[0], cover: formImg || '', chars, fields, events: ev('wEvents', old?.events), endings: ev('wEndings', old?.endings) };
}

function shrink(file, max = 900) {
  return new Promise((res, rej) => { const fr = new FileReader();
    fr.onload = () => { const im = new Image(); im.onload = () => { const k = Math.min(1, max / Math.max(im.width, im.height)); const cv = document.createElement('canvas'); cv.width = Math.round(im.width * k); cv.height = Math.round(im.height * k); cv.getContext('2d').drawImage(im, 0, 0, cv.width, cv.height); res(cv.toDataURL('image/jpeg', .82)); }; im.onerror = rej; im.src = fr.result; };
    fr.onerror = rej; fr.readAsDataURL(file); });
}

  ['me', '내 캐릭터', r => { const p = P(r.profileId); return p ? `${p.name}${p.summary ? ' — ' + p.summary : ''}${p.speech ? '\n말투: ' + p.speech : ''}` : ''; }],
  ['state', '현재 상태', r => { const w = W(r.workId); return [['장소', r.state.place], ['시점', r.state.time], ['목표', r.state.goal], ['소지품', r.state.items], ...w.fields.map(f => [f.label, r.fields[f.key]])].filter(x => x[1] !== '' && x[1] != null).map(([k, v]) => `${k}: ${v}`).join('\n'); }],
  ['rel', '관계', r => r.met.map(c => { const bits = [r.rel[c], r.affinity[c] != null ? '호감 ' + r.affinity[c] : ''].filter(Boolean); return `${charName(r.workId, c)}${bits.length ? ': ' + bits.join(', ') : ''}${r.cmemo[c] ? ' / ' + r.cmemo[c] : ''}`; }).join('\n')],
  ['addr', '호칭 · 말투', r => r.met.map(c => addrLine(r, c)).filter(Boolean).join('\n')],
  ['pins', '고정 기억', r => r.pins.map(x => '- ' + x.text).join('\n')],
  ['items', '소지품', r => r.items.map(x => `${x.name}${x.qty ? ' ×' + x.qty : ''}`).join(', ')],
  ['stats', '수치', r => r.stats.map(x => `${x.name} ${x.value}${x.max ? '/' + x.max : ''}`).join(', ')],
  ['threads', '풀리지 않은 떡밥', r => r.threads.filter(t => !t.done).map(t => '- ' + t.text).join('\n')],
  ['last', '최근 일지', r => { const s = sessionsOf(r.id); const l = s[s.length - 1]; return l ? `${l.title}${l.summary ? ' — ' + l.summary : ''}` : ''; }],
  ['next', '다음에 할 것', r => { const s = sessionsOf(r.id); return s[s.length - 1]?.next || ''; }]
];
function nbBuild(r, pick) { return NB_PARTS.filter(([k]) => pick.includes(k)).map(([k, l, f]) => { const t = f(r); return t ? `[${l}]\n${t}` : ''; }).filter(Boolean).join('\n\n'); }

/* ---------- 섹션 확장 ---------- */
const EXT_SEC = {
  pins(r) {
    const all = memoryText(r);
    return `<div class="blh"><span class="lab">고정 기억 · AI가 자주 잊는 것</span>${cpBtn(all, '전체')}</div>
      <div class="card" style="padding-block:4px">${r.pins.map(x => `<div class="thread"><span>${esc(x.text)}</span>${cpBtn(x.text)}<button class="xbtn" data-act="delPin" data-id="${x.id}" aria-label="삭제">${ICON.x}</button></div>`).join('') || '<p class="muted small" style="margin:10px 0">예: 서진은 커피를 못 마신다 / 차시인과는 존댓말 사이</p>'}</div>

      <div class="blh" style="margin-top:26px"><span class="lab">호칭 · 말투 사전</span></div>

          <div class="fgrid" style="margin-top:8px"><div class="fld"><label for="ad-${cid}-c">나를 부르는 호칭</label><input type="text" id="ad-${cid}-c" value="${esc(a.callsMe || '')}" data-bind="addr" data-key="${cid}" data-f="callsMe"></div><div class="fld"><label for="ad-${cid}-i">내가 부르는 호칭</label><input type="text" id="ad-${cid}-i" value="${esc(a.iCall || '')}" data-bind="addr" data-key="${cid}" data-f="iCall"></div>
          <div class="fld full"><label for="ad-${cid}-t">말투</label><input type="text" id="ad-${cid}-t" value="${esc(a.tone || '')}" placeholder="예: 존댓말, 끝을 흐림" data-bind="addr" data-key="${cid}" data-f="tone"></div></div></div>`; }).join('')}</div>` : '<div class="empty">인물 섹션에서 만난 인물을 먼저 체크하세요.</div>'}`;
  },
  draft(r) {
    return `<div class="blh"><span class="lab">답변 초안</span><span class="code" id="draftCnt">${r.draft.length}자</span></div>
      <textarea id="draftIn" rows="9" data-bind="draft" placeholder="크랙에 보낼 긴 답변을 여기서 다듬어요. 자동으로 저장돼요.">${esc(r.draft)}</textarea>
      <div class="row" style="margin-top:8px"><button class="btn pri grow" data-act="draftCopy">${ICON.copy} 복사</button><button class="btn grow" data-act="draftSave">보관</button><button class="btn" data-act="draftClear" data-arm="1">비우기</button></div>
      <p class="note">상용구 칸({{장소}} 등)을 넣으면 복사할 때 채워져요.</p>
      ${r.drafts.length ? `<div class="blh" style="margin-top:22px"><span class="lab">보관한 초안 · ${r.drafts.length}</span></div><div class="stack">${r.drafts.slice().reverse().map(d => `<div class="card"><p class="ptext clamp" style="margin:0">${esc(d.text)}</p><div class="row" style="margin-top:8px"><span class="code grow">${ago(new Date(d.at).toISOString())} · ${d.text.length}자</span>${cpBtn(fillVars(d.text, r))}<button class="btn sm" data-act="draftLoad" data-id="${d.id}">불러오기</button><button class="xbtn" data-act="draftDel" data-id="${d.id}" data-arm="1" aria-label="삭제">${ICON.x}</button></div></div>`).join('')}</div>` : ''}`;
  },
  saves(r, c) {
    const kids = {}; r.saves.forEach(s => (kids[s.parent || ''] = kids[s.parent || ''] || []).push(s));
    const node = s => `<li><div class="tnode ${c.cmp === s.id ? 'on' : ''}"><div class="ih"><b>${esc(s.name)}</b><span class="code">${ago(new Date(s.at).toISOString())}</span></div>
        ${s.note ? `<p class="ptext" style="margin-top:2px">${esc(s.note)}</p>` : ''}<div class="code">일지 ${s.snap.entries} · 열린 떡밥 ${s.snap.threadsOpen}</div>
        <div class="row" style="margin-top:8px"><button class="btn sm" data-act="saveCmp" data-id="${s.id}">${c.cmp === s.id ? '비교 닫기' : '지금과 비교'}</button><button class="btn sm" data-act="saveRestore" data-id="${s.id}" data-arm="1">되돌리기</button><button class="xbtn" data-act="saveDel" data-id="${s.id}" data-arm="1" aria-label="삭제">${ICON.x}</button></div>
        ${c.cmp === s.id ? saveDiff(r, s) : ''}</div>${kids[s.id] ? `<ul>${kids[s.id].map(node).join('')}</ul>` : ''}</li>`;
    return `<p class="muted small" style="margin:0 0 12px">중요한 선택 직전에 저장해두면, 루트가 어떻게 갈렸는지 나무처럼 볼 수 있어요.</p>
      <button class="btn pri wide" data-act="saveNew">${ICON.branch} 지금 상태 저장</button>
      ${r.saves.length ? `<ul class="tree">${(kids[''] || []).map(node).join('')}</ul>` : '<div class="empty" style="margin-top:12px">저장점이 없어요.</div>'}`;
  },
  reroll(r) {
    return `<p class="muted small" style="margin:0 0 12px">다시 생성한 답변 후보를 붙여넣고 나란히 비교해요. 고른 답변은 금색으로 표시돼요.</p>

      <div class="stack" style="margin-top:14px">${r.rerolls.slice().reverse().map(x => `<div class="rrl"><div class="ih"><b>${esc(x.title || '답변 비교')}</b><span class="iacts"><span class="code" style="padding-top:8px">${ago(new Date(x.at).toISOString())}</span><button class="xbtn" data-act="rerollDel" data-id="${x.id}" data-arm="1" aria-label="삭제">${ICON.x}</button></span></div>
        <div class="cands">${x.cands.map((t, i) => `<div class="cand ${x.pick === i ? 'pick' : ''}"><span class="cl">${String.fromCharCode(65 + i)}${x.pick === i ? ' · 채택' : ''}</span><p>${esc(t)}</p><div class="row"><button class="btn sm" data-act="rerollPick" data-id="${x.id}:${i}">${x.pick === i ? '채택 취소' : '채택'}</button><span class="grow"></span>${cpBtn(t)}</div></div>`).join('')}</div></div>`).join('') || ''}</div>`;
  },
  spend(r) {
    const tot = r.spend.reduce((n, x) => n + (+x.amount || 0), 0);
    return `<div class="stat" style="margin-bottom:12px"><b>${tot.toLocaleString()}</b><span>이 세션에 쓴 재화</span></div>
      <div class="addrow" style="margin-top:0"><input type="number" id="spAmt" inputmode="numeric" placeholder="수량" style="max-width:110px"><input type="text" id="spNote" placeholder="메모 (예: 리롤 5회)"><button class="btn" data-act="spendAdd">기록</button></div>
      <div class="flat" style="margin-top:10px">${r.spend.slice().reverse().map(x => `<div class="thread"><span><b class="qty" style="font-size:14px">${(+x.amount || 0).toLocaleString()}</b> <span class="muted small">${esc(x.note || '')}</span></span><span class="code">${md(x.date)}</span><button class="xbtn" data-act="spendDel" data-id="${x.id}" aria-label="삭제">${ICON.x}</button></div>`).join('')}</div>`;
  }
};
function snapOf(r) { return JSON.parse(JSON.stringify({ state: r.state, fields: r.fields, affinity: r.affinity, rel: r.rel, stats: r.stats.map(({ id, name, value, max }) => ({ id, name, value, max })), entries: sessionsOf(r.id).length, threadsOpen: r.threads.filter(t => !t.done).length })); }
function saveDiff(r, s) {
  const w = W(r.workId), rows = [];
  r.met.forEach(c => { const a = s.snap.affinity[c] ?? 0, b = r.affinity[c] ?? 0; if (a !== b || (s.snap.rel[c] || '') !== (r.rel[c] || '')) rows.push([charName(w.id, c), `${s.snap.rel[c] || '—'} ${a}`, `${r.rel[c] || '—'} ${b}`, b - a]); });
  r.stats.forEach(x => { const o = s.snap.stats.find(y => y.id === x.id); const a = o ? +o.value : 0; if (a !== +x.value) rows.push([x.name, a, x.value, +x.value - a]); });
  [['place', '장소'], ['time', '시점'], ['goal', '목표']].forEach(([k, l]) => { if ((s.snap.state[k] || '') !== (r.state[k] || '')) rows.push([l, s.snap.state[k] || '—', r.state[k] || '—', null]); });
  return `<div class="diff">${rows.length ? rows.map(([n, a, b, d]) => `<div><span>${esc(n)}</span><span class="muted">${esc(a)}</span><span>→ ${esc(b)}</span>${d ? `<span class="delta ${d > 0 ? 'up' : 'dn'}">${d > 0 ? '+' : ''}${d}</span>` : '<span></span>'}</div>`).join('') : '<p class="muted small" style="margin:0">저장 이후 달라진 게 없어요.</p>'}</div>`;
}

/* ---------- 새 화면 ---------- */
Object.assign(VIEWS, {
  builder(c) {
    const r = RUN(c.id); if (!r) return { title: '없는 세션', html: '<div class="empty">삭제된 세션이에요.</div>' };
    const pick = c.pick || ['me', 'state', 'rel', 'addr', 'pins', 'threads', 'next'];
    const out = nbBuild(r, pick), lim = +S.settings.noteLimit || 0, n = out.length;
    return { title: '유저노트 조립', html: `<p class="muted small" style="margin:0 0 12px">${esc(r.title)}의 기록에서 넣을 항목을 고르면 유저노트 문안이 만들어져요.</p>
      <div class="card" style="padding-block:4px">${NB_PARTS.map(([k, l, f]) => { const t = f(r); return `<label class="check"><input type="checkbox" data-bind="nbPart" data-key="${k}" ${pick.includes(k) ? 'checked' : ''} ${t ? '' : 'disabled'}><span class="grow">${l}</span><span class="code">${t ? t.length + '자' : '비어 있음'}</span></label>`; }).join('')}</div>
      <div class="blh" style="margin-top:20px"><span class="lab">결과 · 직접 고칠 수 있어요</span><span class="code" id="nbCnt" style="${lim && n > lim ? 'color:var(--seal)' : ''}">${n}${lim ? ' / ' + lim : ''}자</span></div>
      ${lim ? `<div class="bar" style="margin-bottom:8px"><i style="width:${Math.min(100, n / lim * 100)}%;${n > lim ? 'background:var(--seal)' : ''}"></i></div>` : ''}
      <textarea id="nbOut" rows="12" data-bind="nbOut">${esc(out)}</textarea>
      <div class="fgrid" style="margin-top:10px"><div class="fld"><label for="nbLim">글자 제한 (0은 없음)</label><input type="number" id="nbLim" value="${lim}" data-bind="nbLim"></div><div class="fld"><span class="lab2">&nbsp;</span><button class="btn pri" data-act="nbCopy">${ICON.copy} 복사</button></div></div>
      <button class="btn wide" style="margin-top:8px" data-act="nbSave">유저노트로 저장하고 세션에 연결</button>
      ${lim && n > lim ? `<p class="note" style="color:var(--seal)">${n - lim}자 넘어요. 긴 항목부터 빼보세요.</p>` : ''}` };
  },
  exportRun(c) {
    const r = RUN(c.id); if (!r) return { title: '없는 세션', html: '' };
    const mode = c.mode || 'novel', txt = exportText(r, mode);
    return { title: '정리본 내보내기', html: `<div class="seg" style="margin-bottom:14px"><button data-act="flt" data-key="mode" data-id="novel" aria-pressed="${mode === 'novel'}">이야기형</button><button data-act="flt" data-key="mode" data-id="log" aria-pressed="${mode === 'log'}">기록형</button></div>
      <div class="copybox" style="max-height:none;font-family:var(--f-display);font-size:14.5px;line-height:1.85">${esc(txt)}</div>
      <div class="row" style="margin-top:10px"><button class="btn pri grow" data-act="copy" data-text="${esc(txt)}">${ICON.copy} 전체 복사</button><button class="btn grow" data-act="exportTxt" data-id="${r.id}">.txt 저장</button></div>
      <p class="note">${txt.length.toLocaleString()}자 · 일지 ${sessionsOf(r.id).length}편</p>` };
  },
  stats(c) {
    const now = new Date(), ym = c.ym || `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
    const [Y, M] = ym.split('-').map(Number); const first = new Date(Y, M - 1, 1).getDay(), days = new Date(Y, M, 0).getDate();
    const byDay = {}; S.entries.forEach(e => { byDay[e.date] = (byDay[e.date] || 0) + 1; });
    const cell = d => { const k = `${ym}-${String(d).padStart(2, '0')}`, n = byDay[k] || 0; return `<button class="cd l${Math.min(n, 3)} ${c.day === k ? 'sel' : ''} ${k === today() ? 'td' : ''}" data-act="calDay" data-id="${k}" aria-label="${M}월 ${d}일 일지 ${n}편"><span>${d}</span></button>`; };
    let streak = 0; { const d = new Date(); if (!byDay[today()]) d.setDate(d.getDate() - 1); for (;;) { const k = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); if (!byDay[k]) break; streak++; d.setDate(d.getDate() - 1); } }
    const cc = {}; S.entries.forEach(e => { const r = RUN(e.runId); if (!r) return; e.chars.forEach(ch => { const k = r.workId + ':' + ch; cc[k] = (cc[k] || 0) + 1; }); });
    const top = Object.entries(cc).sort((a, b) => b[1] - a[1]).slice(0, 5), mx = top[0]?.[1] || 1;
    const spend = S.runs.reduce((n, r) => n + r.spend.reduce((m, x) => m + (+x.amount || 0), 0), 0);
    const pm = new Date(Y, M - 2, 1), nm = new Date(Y, M, 1), f = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
    const dayList = c.day ? S.entries.filter(e => e.date === c.day) : [];
    return { title: '플레이 달력', html: `
      <div class="kgrid"><div class="stat"><b>${streak}</b><span>연속 일수</span></div><div class="stat"><b>${Object.keys(byDay).length}</b><span>플레이한 날</span></div><div class="stat"><b>${S.entries.length}</b><span>일지</span></div><div class="stat"><b>${sceneCount()}</b><span>명장면</span></div></div>
      <div class="calh"><button class="ib" data-act="flt" data-key="ym" data-id="${f(pm)}" aria-label="이전 달">${ICON.back}</button><b>${Y}. ${String(M).padStart(2, '0')}</b><button class="ib" data-act="flt" data-key="ym" data-id="${f(nm)}" aria-label="다음 달" style="transform:scaleX(-1)">${ICON.back}</button></div>
      <div class="cal">${['일', '월', '화', '수', '목', '금', '토'].map(d => `<span class="cw">${d}</span>`).join('')}${'<span></span>'.repeat(first)}${Array.from({ length: days }, (_, i) => cell(i + 1)).join('')}</div>
      ${c.day ? `<div class="glab">${esc(c.day)} · ${dayList.length}편</div>${dayList.length ? `<div class="flat">${dayList.map(e => sesRow(e, true)).join('')}</div>` : '<div class="empty">이 날은 기록이 없어요.</div>'}` : ''}
      <h2 class="sec">가장 많이 만난 인물</h2>
      ${top.length ? `<div class="stack">${top.map(([k, n]) => { const [w, ch] = k.split(':'); return `<div class="prog" style="grid-template-columns:96px 1fr 30px"><span>${esc(charName(w, ch))}</span><div class="bar"><i style="width:${n / mx * 100}%"></i></div><b>${n}</b></div>`; }).join('')}</div>` : '<div class="empty">일지에 등장 인물을 체크하면 모여요.</div>'}
      <h2 class="sec">세션별 기록량</h2>
      <div class="stack">${S.runs.slice().sort((a, b) => sessionsOf(b.id).length - sessionsOf(a.id).length).slice(0, 5).map(r => { const n = sessionsOf(r.id).length; return `<div class="prog" style="grid-template-columns:96px 1fr 30px"><span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(r.title)}</span><div class="bar"><i style="width:${n / Math.max(1, ...S.runs.map(x => sessionsOf(x.id).length)) * 100}%"></i></div><b>${n}</b></div>`; }).join('')}</div>
      <h2 class="sec">재화 사용</h2><div class="stat"><b>${spend.toLocaleString()}</b><span>모든 세션 합계</span></div>` };
  },
  snippets() {
    const r = activeRun();
    return { title: '상용구', action: `<button class="act" data-act="newSnippet">+ 추가</button>`, html: `
      <div class="card" style="margin-bottom:12px"><div class="lab" style="margin-bottom:6px">칸을 채울 세션</div>${sel('snRun', 'activeRun', [['', '선택 안 함'], ...S.runs.map(x => [x.id, x.title])], r ? r.id : '')}<p class="note">문구 속 ${esc('{{장소}}')} 같은 칸이 이 세션 정보로 바뀌어 복사돼요.</p></div>
      <div class="stack">${S.snippets.map(s => { const f = fillVars(s.text, r); return `<div class="card snip"><div class="t" data-act="copy" data-text="${esc(f)}" role="button" tabindex="0"><b>${esc(s.title)}</b><div>${esc(f)}</div></div><div class="stack" style="gap:6px"><button class="btn sm pri" data-act="copy" data-text="${esc(f)}">복사</button><button class="btn sm" data-act="editSnippet" data-id="${s.id}">수정</button></div></div>`; }).join('') || '<div class="empty">상용구가 없어요.</div>'}</div>
      <p class="note">쓸 수 있는 칸: ${esc(VAR_HELP)}</p>` };
  }
});
function exportText(r, mode) {
  const w = W(r.workId), p = P(r.profileId), ss = sessionsOf(r.id);
  const head = [`${r.title}`, `${w.title}${p ? ' · ' + p.name : ''}`, ''];
  if (mode === 'log') return head.concat(ss.map(e => entryText(e))).join('\n\n');
  return head.concat(ss.map((e, i) => {
    const L = [`— ${i + 1}. ${e.title || '무제'} —`];
    const where = [e.when, e.place].filter(Boolean).join(', '); if (where) L.push(where + '.');
    if (e.summary) L.push(e.summary);
    if (e.events) L.push(e.events.split('\n').filter(Boolean).join(' 그리고 ') + '.');
    e.scenes.forEach(s => L.push(`${s.who ? s.who + '이(가) 말했다. ' : ''}“${s.text}”`));
    if (e.choice) L.push(`나는 ${e.choice.replace(/[.。]$/, '')}.`);
    return L.join('\n');
  })).join('\n\n');
}
