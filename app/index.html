/* ================= 컴퓨터 화면 · 접이식 왼쪽 메뉴 ================= */
const PCMQ = window.matchMedia('(min-width:1024px)');
const isPC = () => PCMQ.matches;
Object.assign(ICON, { caret: sv('<path d="M6 9l6 6 6-6"/>', 'width="14" height="14"'), sidebar: sv('<rect x="3.5" y="4.5" width="17" height="15"/><path d="M9.5 4.5v15"/>') });
function sideSt() { S.settings.side = S.settings.side || { open: false, g: { rec: true }, s: {} }; return S.settings.side; }
const SIDE_GROUPS = () => [
  ['rec', '기록', [['runs', '세션', S.runs.length], ['profiles', '프로필 도감', S.profiles.length], ['sessions', '일지 모아보기', S.entries.length], ['notes', '유저노트', S.notes.length], ['dex', '기록 도감'], ['stats', '플레이 달력 · 통계']]],
  ['work', '작품', [['works', '작품 허브', AW().length], ['notice', '공지 · 소통']]],
  ['play', '플레이 보조', [['snippets', '상용구', S.snippets.length], ['bgm', 'BGM 플레이어', BGM.length], ['ach', '업적 도장', ACH.filter(a => a.test()).length + '/' + ACH.length]]],
  ['admin', '관리', [['backup', '백업 · 복원'], ['settings', '설정']]]
];
const SUBPAGE = { openRun: 'run', openProfile: 'profile', openSession: 'session', openNote: 'note', openWork: 'work' };
const sli = (act, id, label, meta, extra = '') => `<button class="sli ${cur().page === SUBPAGE[act] && cur().id === id ? 'on' : ''}" data-act="${act}" data-id="${esc(id)}" ${extra}><span class="tt">${esc(label)}</span>${meta ? `<small>${esc(meta)}</small>` : ''}</button>`;
function sideSub(k) {
  const more = (n, tot) => tot > n ? `<button class="sli more" data-act="goPage" data-id="${k}"><span class="tt">전체 ${tot}개 보기 ›</span></button>` : '';
  const none = t => `<div class="snone">${t}</div>`;
  if (k === 'runs') { const l = [...S.runs].sort((a, b) => b.updated - a.updated); return l.slice(0, 8).map(r => sli('openRun', r.id, r.title, W(r.workId).short || W(r.workId).title)).join('') + more(8, l.length) || none('아직 세션이 없어요'); }
  if (k === 'profiles') return S.profiles.slice(0, 8).map(p => sli('openProfile', p.id, p.name, S.runs.filter(r => r.profileId === p.id).length + '세션')).join('') + more(8, S.profiles.length) || none('아직 프로필이 없어요');
  if (k === 'sessions') { const l = [...S.entries].sort((a, b) => (b.date || '').localeCompare(a.date || '') || b.created - a.created); return l.slice(0, 6).map(e => sli('openSession', e.id, e.title || `${sesNo(e)}번째 일지`, RUN(e.runId)?.title || '')).join('') + more(6, l.length) || none('아직 일지가 없어요'); }
  if (k === 'notes') return S.notes.slice(0, 8).map(n => sli('openNote', n.id, n.title || '제목 없음', n.workId ? (W(n.workId).short || '') : '공통')).join('') + more(8, S.notes.length) || none('아직 노트가 없어요');
  if (k === 'works') return AW().map(w => sli('openWork', w.id, w.title, w.status === '제작중' ? '제작중' : (w.custom ? '추가' : ''))).join('');
  if (k === 'snippets') return S.snippets.map(s => `<button class="sli" data-act="copy" data-text="${esc(s.text)}" title="눌러서 복사"><span class="tt">${esc(s.title)}</span><small>복사</small></button>`).join('') || none('상용구가 없어요');
  if (k === 'bgm') return BGM.map((t, i) => `<button class="sli ${playing === i && !audio.paused ? 'on' : ''}" data-act="play" data-id="${i}"><span class="tt">${esc(t.title)}</span><small>${playing === i && !audio.paused ? '재생 중' : '▶'}</small></button>`).join('') || none('등록된 곡이 없어요');
  return '';
}
const SUBS = new Set(['runs', 'profiles', 'sessions', 'notes', 'works', 'snippets', 'bgm']);
function sideHtml() {
  const st = sideSt(), c = cur(), root = R.stack[0].page, m = moonNow();
  const here = k => c.page === k || (R.stack.length === 1 && root === k);
  return `<div class="side-in">
    <div class="sbrand"><button class="wm" data-act="nav" data-id="home">MOON</button><button class="ib" data-act="sideToggle" aria-label="메뉴 닫기">${ICON.sidebar}</button></div>
    <div class="smain">${TABS.map(([k, l]) => `<button class="stab" data-act="nav" data-id="${k}" ${root === k ? 'aria-current="page"' : ''}>${tabIcon(k)}<span>${l}</span></button>`).join('')}</div>
    <button class="sme" data-act="goPage" data-id="stats"><span class="av">${moonSvg(m.f)}</span><span class="grow"><b>나의 기록</b><small>세션 ${S.runs.length} · 일지 ${S.entries.length}</small></span></button>
    ${SIDE_GROUPS().map(([g, gl, items]) => { const go = !!st.g[g]; return `<div class="sg ${go ? 'open' : ''}">
      <button class="sgh" data-act="sideGrp" data-id="${g}" aria-expanded="${go}"><span class="grow">${gl}</span><i>${ICON.caret}</i></button>
      ${go ? `<div class="sgb">${items.map(([k, l, cnt]) => { const so = SUBS.has(k) && !!st.s[k]; return `<div class="sit ${so ? 'open' : ''}">
        <button class="snav" data-act="goPage" data-id="${k}" ${here(k) ? 'aria-current="page"' : ''}>${ICON[k] || ''}<span class="grow">${l}</span>${cnt != null ? `<span class="cnt">${esc(String(cnt))}</span>` : ''}</button>
        ${SUBS.has(k) ? `<button class="sx" data-act="sideSub" data-id="${k}" aria-expanded="${so}" aria-label="${l} 목록 ${so ? '접기' : '펼치기'}">${ICON.caret}</button>` : ''}</div>
        ${so ? `<div class="ssub">${sideSub(k)}</div>` : ''}`; }).join('')}</div>` : ''}</div>`; }).join('')}
    <p class="sfoot2">${esc(CREATOR)} 플레이 기록소 · v${APP_VERSION}</p></div>`;
}
function renderSide() {
  const on = isPC() && sideSt().open;
  document.body.classList.toggle('pc', isPC()); document.body.classList.toggle('side-on', on);
  if (!isPC()) return;
  const b = $('#bnav'), sc = b.querySelector('.side-in')?.scrollTop || 0;
  b.innerHTML = sideHtml(); const n = b.querySelector('.side-in'); if (n) n.scrollTop = sc;
  b.setAttribute('aria-hidden', on ? 'false' : 'true'); b.inert = !on;
  const top = $('#top'); if (!top.querySelector('.sidet')) top.insertAdjacentHTML('afterbegin', `<button class="ib sidet" data-act="sideToggle" aria-label="${on ? '메뉴 닫기' : '메뉴 열기'}" aria-expanded="${on}">${ICON.sidebar}</button>`);
}
const _renderBase = render;
render = function () { _renderBase(); renderSide(); };
Object.assign(ACT, {
  sideToggle: () => { const st = sideSt(); st.open = !st.open; persist(); renderSide(); const t = $('#top .sidet'); if (t) { t.setAttribute('aria-expanded', st.open); t.setAttribute('aria-label', st.open ? '메뉴 닫기' : '메뉴 열기'); } },
  sideGrp: id => { const st = sideSt(); st.g[id] = !st.g[id]; persist(); renderSide(); },
  sideSub: id => { const st = sideSt(); st.s[id] = !st.s[id]; persist(); renderSide(); }
});
PCMQ.addEventListener ? PCMQ.addEventListener('change', () => render()) : PCMQ.addListener(() => render());
document.addEventListener('keydown', e => { if (isPC() && (e.ctrlKey || e.metaKey) && e.key === '\\') { e.preventDefault(); ACT.sideToggle(); } });

</script>
